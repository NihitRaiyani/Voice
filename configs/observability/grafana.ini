# Native isolated instance. Supply GF_SECURITY_ADMIN_PASSWORD before first start.
[server]
http_addr = 127.0.0.1
http_port = 3000
[paths]
data = var/roma/observability/grafana/data
logs = var/roma/observability/grafana/logs
plugins = var/roma/observability/grafana/plugins
provisioning = configs/observability/provisioning
[security]
disable_gravatar = true
[users]
allow_sign_up = false
[auth.anonymous]
enabled = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
