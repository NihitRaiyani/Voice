[project]
name = "roma"
version = "0.1.0"
description = "Roma — outbound code-mix voice agent for Weltec"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<47",
    "pydantic-settings>=2.5",
    "pyjwt>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
workers = [
    "dramatiq[redis]>=2.0,<3",
]
dev = [
    "fakeredis>=2.20",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.12,<5",
]
telephony = [
    "anthropic>=0.76,<1",
    "fastapi>=0.139.2",
    "pipecat-ai[sarvam,silero,openai]>=1.6.0",
    "redis>=5.0",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]
voice-lab = [
    "faster-whisper>=1.2,<2",
    "sounddevice>=0.5,<0.6",
]
indic-asr = [
    "torch>=2.5,<3",
    "transformers>=4.46,<6",
]
mlx-asr = [
    "mlx-whisper==0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a disposable PostgreSQL database",
]


[tool.mypy]
python_version = "3.11"
files = [
    "roma/core/call_capabilities.py",
    "roma/core/rate_limit.py",
    "roma/core/field_encryption.py",
    "roma/core/privacy_settings.py",
    "roma/core/privacy_paths.py",
    "roma/core/recording_consent.py",
    "roma/domain/knowledge",
    "roma/schemas/twilio.py",
    "roma/services/privacy_service.py",
    "roma/services/recording_service.py",
    "roma/repositories/postgres/privacy.py",
    "roma/repositories/redis/request_rate_limit.py",
    "roma/api/v1/privacy.py",
    "roma/providers/ai",
    "roma/core/openai_llm_settings.py",
    "roma/core/claude_llm_settings.py",
    "roma/core/ai_contracts.py",
    "roma/core/speech_settings.py",
    "benchmarks/asr/hf_endpoint/handler.py",
    "roma/domain/conversation/language.py",
    "roma/services/speech_input.py",
    "roma/eval/speech.py",
    "roma/eval/hosted_asr.py",
    "roma/eval/asr_benchmark.py",
    "roma/eval/corpus_v2.py",
    "roma/eval/local_whisper.py",
    "roma/eval/local_indic.py",
    "roma/eval/asr_comparison.py",
    "roma/eval/benchmark_evidence.py",
    "roma/eval/tts.py",
    "roma/core/tts_settings.py",
    "roma/services/tts_service.py",
    "roma/services/voice_prototype.py",
    "roma/providers/reliability.py",
    "roma/providers/jobs/claude_summary.py",
    "roma/core/auth_settings.py",
    "roma/core/security.py",
    "roma/services/auth_service.py",
    "roma/repositories/postgres/auth.py",
    "roma/api/v1/auth.py",
    "roma/schemas/auth.py",
    "roma/repositories/redis/auth_rate_limit.py",
    "roma/repositories/redis/webhook_window.py",
    "roma/services/webhook_service.py",
    "roma/core/async_queue.py",
    "roma/core/cpu_worker.py",
    "roma/services/streaming_text.py",
    "roma/services/streaming_voice.py",
    "roma/services/live_call_state.py",
    "roma/repositories/redis/call_lease.py",
    "roma/services/voice_pronunciation.py",
    "roma/providers/audio",
    "roma/repositories/postgres/voice_lab.py",
    "roma/repositories/postgres/benchmarks.py",
    "roma/core/prompt_privacy.py",
    "roma/services/conversation_prompts.py",
    "roma/services/text_conversation_service.py",
    "roma/services/safety_service.py",
    "roma/services/booking_service.py",
    "roma/services/booking_session.py",
    "roma/domain/appointments/booking.py",
    "roma/repositories/postgres/booking.py",
    "roma/repositories/redis/appointment_holds.py",
    "roma/domain/safety",
    "roma/domain/audio",
    "roma/eval/audio.py",
    "roma/repositories/postgres/safety.py",
    "roma/eval/openai_language.py",
    "roma/providers/telephony",
    "roma/realtime/provider_llm.py",
    "roma/api/v1/responses.py",
    "roma/schemas/rest_api.py",
]
ignore_missing_imports = true
show_error_codes = true
pretty = true
warn_unused_ignores = true

[tool.ruff]
# 96 not 88: the guardrail and turn-taking modules carry long explanatory comments and
# Gujarati/Devanagari lexicon literals that read worse when wrapped.
line-length = 96
src = ["roma", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports/names, the ones that actually bite
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async — mis-shaped awaits on the barge-in path
    "BLE",  # blind `except Exception` — media.py already marks its deliberate ones
    "RUF",  # ruff's own, incl. RUF001-003 ambiguous-unicode
]
ignore = [
    "E501",  # line length is formatter's business, not a lint failure
    # Roma's lexicons are DELIBERATELY full of Gujarati/Devanagari and look-alike Latin
    # spellings — that is the feature (docs/04, D3). Flagging them as "ambiguous unicode"
    # would fire on every entry and train us to ignore the linter.
    "RUF001",
    "RUF002",
    "RUF003",
    # `__all__` is ordered to match declaration order, which reads better than
    # alphabetical for these modules. Not a convention worth 18 findings.
    "RUF022",
]
