[project]
name = "roma"
version = "0.1.0"
description = "Roma — outbound code-mix voice agent for Weltec"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.20",
    "pytest>=8.0",
    "ruff>=0.9",
]
telephony = [
    "fastapi>=0.139.2",
    "pipecat-ai[sarvam,silero,openai]>=1.6.0",
    "redis>=5.0",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 96 not 88: the guardrail and turn-taking modules carry long explanatory comments and
# Gujarati/Devanagari lexicon literals that read worse when wrapped.
line-length = 96
src = ["roma", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports/names, the ones that actually bite
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async — mis-shaped awaits on the barge-in path
    "BLE",  # blind `except Exception` — media.py already marks its deliberate ones
    "RUF",  # ruff's own, incl. RUF001-003 ambiguous-unicode
]
ignore = [
    "E501",  # line length is formatter's business, not a lint failure
    # Roma's lexicons are DELIBERATELY full of Gujarati/Devanagari and look-alike Latin
    # spellings — that is the feature (docs/04, D3). Flagging them as "ambiguous unicode"
    # would fire on every entry and train us to ignore the linter.
    "RUF001",
    "RUF002",
    "RUF003",
    # `__all__` is ordered to match declaration order, which reads better than
    # alphabetical for these modules. Not a convention worth 18 findings.
    "RUF022",
]
