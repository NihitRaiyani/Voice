name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://roma:roma@127.0.0.1:54329/roma
      REDIS_URL: redis://127.0.0.1:6380/0
      APP_ENV: dev
      API_TOKEN: ci-local-token
      PII_HASH_KEY: ci-local-pii-hash-key-change-before-shared-use
      STT_PROVIDER: mock
      LLM_PROVIDER: mock
      TTS_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      TELEPHONY_PROVIDER: mock
      PUBLIC_BASE_URL: https://example.invalid
      NLTK_DATA: /tmp/voice-agent-tokenizer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install native PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 redis-server
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra telephony --extra workers
      - name: Start native services
        run: make services-up
      - name: Lint
        run: make lint
      - name: Type check
        run: make type
      - name: Apply migrations
        run: make db-upgrade
      - name: Provider contract tests
        run: make test-provider-contracts
      - name: Mocked unit/API checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 uv run --no-sync pytest -q -p no:cacheprovider \
            tests/api/v1/test_rest_resources.py \
            tests/architecture/test_dependency_direction.py \
            tests/core/test_migration_settings.py
